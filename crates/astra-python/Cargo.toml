[package]
name = "astra-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
astra-types = { workspace = true }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
thiserror = { workspace = true }

[lib]
name = "astra"
path = "src/lib.rs"
# Both targets: rlib keeps `cargo test` working, cdylib produces the
# importable module (copied to astra.so; no maturin needed for local use).
crate-type = ["cdylib", "rlib"]
