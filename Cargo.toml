[workspace]
resolver = "3"
members = [
    "crates/astra-book",
    "crates/astra-normalize",
    "crates/astra-record",
    "crates/astra-replay",
    "crates/astra-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/VarunGore36/AstralProject"
rust-version = "1.85"

[workspace.dependencies]
astra-book = { path = "crates/astra-book" }
astra-normalize = { path = "crates/astra-normalize" }
astra-record = { path = "crates/astra-record" }
astra-replay = { path = "crates/astra-replay" }
astra-types = { path = "crates/astra-types" }
arrow = "60"
chrono = "0.4"
parquet = "60"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
postcard = { version = "1", features = ["use-std"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
